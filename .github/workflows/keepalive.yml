name: Keep scheduled scraper active

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check repository activity
        id: activity
        shell: bash
        run: |
          last_commit_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date +%s)"
          due="$(python scripts/keepalive.py "$last_commit_epoch" "$now_epoch")"
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "Keepalive due: $due"

      - name: Refresh repository activity
        if: steps.activity.outputs.due == 'true'
        shell: bash
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keep scheduled scraper active"
          git push
